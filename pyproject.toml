[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookips"
version = "0.1.0"
description = "도서 IP 정산 자동화 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.100",
    "requests>=2.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "httpx>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
