{% extends "base.html" %}

{% block title %}ISBN 조회 - BookIPS{% endblock %}

{% block content %}
<div class="lookup-page">
    <h1>ISBN 조회</h1>
    <p>국립중앙도서관 서지정보 API로 도서 정보를 확인합니다.</p>

    <div class="card">
        <div class="form-row">
            <div class="form-group" style="flex:2">
                <label for="isbn">ISBN</label>
                <input type="text" name="isbn" id="isbn-input"
                       placeholder="978-89-12345-67-8"
                       hx-get="/api/isbn/search"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#isbn-result"
                       hx-include="this">
            </div>
            <div class="form-group" style="align-self:flex-end">
                <button class="btn-submit"
                        hx-get="/api/isbn/search"
                        hx-include="#isbn-input"
                        hx-target="#isbn-result">
                    조회
                </button>
            </div>
        </div>
    </div>

    <div id="isbn-result">
        <!-- HTMX로 결과가 여기에 삽입됨 -->
    </div>
</div>
{% endblock %}
